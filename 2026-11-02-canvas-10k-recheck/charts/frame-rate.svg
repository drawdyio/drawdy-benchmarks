<svg xmlns="http://www.w3.org/2000/svg" width="880" height="566" viewBox="0 0 880 566" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Frame rate with 10,000 elements</title>
<desc id="d">Pan with the whole board in view, Drawdy: 120 fps. Pan with the whole board in view, Excalidraw: 9.9 fps. Pan with the whole board in view, tldraw: 11 fps. Zoom in and out, in short bursts, Drawdy: 118 fps. Zoom in and out, in short bursts, Excalidraw: 3.5 fps. Zoom in and out, in short bursts, tldraw: 54 fps. Pan at 100% zoom, Drawdy: 120 fps. Pan at 100% zoom, Excalidraw: 104 fps. Pan at 100% zoom, tldraw: 92 fps</desc>
<rect x="0.5" y="0.5" width="879" height="565" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
