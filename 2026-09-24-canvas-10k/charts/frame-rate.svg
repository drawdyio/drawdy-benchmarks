<title id="t">Frame rate with 10,000 elements</title>
<desc id="d">Pan with the whole board in view, Drawdy: 120 fps. Pan with the whole board in view, Excalidraw: 10 fps. Pan with the whole board in view, tldraw: 11 fps. Zoom in and out, in short bursts, Drawdy: 119 fps. Zoom in and out, in short bursts, Excalidraw: 3.7 fps. Zoom in and out, in short bursts, tldraw: 52 fps. Pan at 100% zoom, Drawdy: 120 fps. Pan at 100% zoom, Excalidraw: 104 fps. Pan at 100% zoom, tldraw: 86 fps</desc>
